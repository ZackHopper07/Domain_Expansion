# Starts PostgreSQL and the FastAPI backend for local development.
#   docker compose up --build
# API: http://localhost:8000  (interactive docs at /docs)
# The React frontend still runs separately with `npm run dev`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricemydomain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricemydomain}
      POSTGRES_DB: ${POSTGRES_DB:-pricemydomain}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pricemydomain} -d ${POSTGRES_DB:-pricemydomain}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pricemydomain}:${POSTGRES_PASSWORD:-pricemydomain}@db:5432/${POSTGRES_DB:-pricemydomain}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5180}
      AVAILABILITY: ${AVAILABILITY:-rdap}
      PROVIDERS: ${PROVIDERS:-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
